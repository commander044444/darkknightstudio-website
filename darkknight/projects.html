<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروژه‌ها | Darkknight Studio</title>
  <meta name="theme-color" content="#050508">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">⚔</span><span class="logo-text">DARKKNIGHT</span></a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="shop.html" class="nav-link">فروشگاه</a>
        <a href="projects.html" class="nav-link active">پروژه‌ها</a>
        <a href="membership.html" class="nav-link">عضویت</a>
        <a href="support.html" class="nav-link">پشتیبانی</a>
      </nav>
      <div class="header-actions">
        <button class="menu-toggle" id="menu-toggle" aria-label="منو"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main class="container section">
    <div class="section-header" style="text-align:right">
      <h1>پروژه‌های Darkknight Studio</h1>
      <p>پروژه‌های در حال توسعه و منتشرشده</p>
    </div>
    <div class="grid grid-3" id="projects-grid">
      <div class="loading-state"><div class="spinner"></div><p>در حال بارگذاری…</p></div>
    </div>
  </main>
  <script>
  (function(){
    var URL="https://exaryvtjayuwgyqnioem.supabase.co";
    var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YXJ5dnRqYXl1d2d5cW5pb2VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzgxMjUsImV4cCI6MjEwNTE1NDEyNX0.qMKyG9gwUTeNbfXhzbSbTEJMEh4Dy-5M3gZ9vXpmsKs";
    function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    var toggle=document.getElementById("menu-toggle"), nav=document.getElementById("nav");
    if(toggle&&nav) toggle.onclick=function(){nav.classList.toggle("open");toggle.classList.toggle("open");};
    var grid=document.getElementById("projects-grid");
    fetch(URL+"/rest/v1/projects?select=id,title,description,logo_url,banner_url,status,version&status=neq.ARCHIVED&order=display_order",{
      headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}
    }).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(data){
      if(!data||!data.length){grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">⚔</div><p>پروژه‌ای ثبت نشده</p></div>';return;}
      var st={ONLINE:"آنلاین",OFFLINE:"آفلاین",IN_DEVELOPMENT:"در حال توسعه"};
      grid.innerHTML=data.map(function(p){
        var img=(p.banner_url||p.logo_url)?'<img class="project-card-img" src="'+esc(p.banner_url||p.logo_url)+'" loading="lazy">':'<div class="project-card-img" style="display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:.4">⚔</div>';
        return '<a href="project.html?id='+p.id+'" class="card project-card">'+img+'<div class="project-card-body"><div style="display:flex;justify-content:space-between;gap:.5rem"><h3 class="card-title">'+esc(p.title)+'</h3><span class="badge">'+(st[p.status]||p.status)+'</span></div><p class="text-muted" style="font-size:.85rem">'+esc((p.description||"").slice(0,140))+'</p></div></a>';
      }).join("");
    }).catch(function(){
      grid.innerHTML='<div class="empty-state"><p>خطا در بارگذاری</p></div>';
    });
  })();
  </script>
</body>
</html>
